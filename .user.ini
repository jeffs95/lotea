; Límites de PHP para producción.
;
; Sin este archivo, Heroku deja los valores de fábrica de PHP:
; upload_max_filesize en 2M y post_max_size en 8M. Una foto tomada con la
; cámara de un teléfono actual pesa entre 4 y 12 MB, así que no entraba.
;
; Y lo peor de post_max_size es cómo falla: cuando la petición lo supera, PHP
; la descarta entera antes de que Laravel exista. No hay error, no hay log; el
; formulario simplemente no hace nada. Ya nos pasó con la imagen de portada.
;
; Por eso post_max_size va por encima de upload_max_filesize: tiene que caber
; el archivo más el resto del formulario.

upload_max_filesize = 20M
post_max_size = 24M

; Redimensionar una foto de 48 megapíxeles necesita unos 200 MB solo para el
; mapa de bits. Con los 128M de fábrica, la conversión moría a media imagen.
memory_limit = 512M

; Heroku corta el request a los 30 segundos de todos modos; esto solo evita que
; PHP lo corte antes y deje el trabajo a medias.
max_execution_time = 30
