; Lo que el sistema necesita de PHP, en un sitio donde se lee.
;
; Los tres primeros tienen que ir de acuerdo con el «client_max_body_size» de
; nginx: si nginx corta antes, PHP ni se entera y el usuario ve un error del
; servidor sin explicación. Y las fotos de un celular pesan varios megas.
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 60
max_file_uploads = 30

expose_php = Off

; Los errores van al registro, no a la pantalla.
;
; Un fallo que ocurre antes de que Laravel levante su propio manejador lo
; imprime PHP tal cual: rutas completas del servidor, nombres de archivos y
; la pila entera, a cualquiera que esté mirando. Laravel ya decide qué
; mostrar según APP_DEBUG; esto cubre lo que pasa antes de que pueda hacerlo.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Código compilado en memoria. En producción los archivos no cambian hasta el
; siguiente despliegue, que reconstruye el contenedor entero, así que no hace
; falta que PHP ande revisando fechas en cada petición.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
