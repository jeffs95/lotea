; nginx y php-fpm en el mismo contenedor, con alguien que los vigile.
;
; Separarlos en dos contenedores es más ortodoxo, pero obliga a compartir el
; código por volumen entre los dos y a mantenerlos sincronizados en cada
; despliegue. Para un sistema de este tamaño eso es complicarse: aquí la
; imagen lleva el código adentro y se reemplaza entera.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
