server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # De acuerdo con post_max_size de PHP. Si este número queda por debajo,
    # nginx rechaza la subida antes de que PHP la vea y el mensaje que recibe
    # el usuario no explica nada.
    client_max_body_size 24M;

    # Detrás de Cloudflare o de un túnel, la IP real viene en la cabecera. Sin
    # esto el registro de auditoría anota la del proxy para todo el mundo.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Lo que Vite compiló lleva el hash en el nombre: cambia de nombre cuando
    # cambia, así que se puede cachear sin miedo.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;

        # Una lectura de documento con IA puede tardar; el corte corto deja al
        # usuario con un 502 sin explicación.
        fastcgi_read_timeout 120;
    }

    # Nada de puntos ocultos, salvo lo que piden los emisores de certificados.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log /dev/stderr warn;
    access_log /dev/stdout;
}
